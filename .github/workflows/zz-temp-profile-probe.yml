name: TEMP profile link probe (removed before PR)

on:
  push:
    branches: [claude/project-thread-ykraup]
    paths: ['.github/probe/**', '.github/workflows/zz-temp-profile-probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: node .github/probe/probe.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out
