# NOTE: this workflow's `name` ("CI - Build and Test") is load-bearing —
# deploy-cpanel.yml chains off it via `on.workflow_run.workflows`. If you
# rename it, update that trigger in deploy-cpanel.yml or auto-deploy will
# silently stop firing.
name: CI - Build and Test

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for prohibited lockfiles
        run: |
          if [ -f package-lock.json ] || [ -f yarn.lock ]; then
            echo "::error::Prohibited lockfile detected (package-lock.json or yarn.lock). Only pnpm-lock.yaml is permitted."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run linting
        run: pnpm run lint

      - name: Run unit tests
        run: pnpm test
        env:
          CI: true

      - name: Build Next.js site
        run: pnpm run build

      - name: Check internal links
        run: pnpm run check-links

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          CI: true

      - name: Upload build artifacts (for debugging)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: |
            .next/
            out/
          retention-days: 7
