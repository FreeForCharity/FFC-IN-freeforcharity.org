# WHMCS configuration ops via the WHMCS Admin API (manual dispatch only).
#
# Purpose: read/update WHMCS General Settings values from CI — first use case
# is wiring the checkout Terms-of-Service acceptance to the site's policy set
# (publicity consent, issues #378/#379/#380).
#
# Credentials come from Azure Key Vault kv-ffc-admin-prod-cbm via the same
# OIDC login the cpanel-* workflows use — no GitHub secrets beyond the two
# OIDC client identifiers that already exist. Vault secrets read (masked,
# never printed):
#   read-all-ffc-whmcs-api-identifier      WHMCS API credential identifier
#   read-all-ffc-whmcs-api-secret          paired secret
#   read-all-ffc-apim-whmcs-subscription-key  sent as Ocp-Apim-Subscription-Key
#
# Calls go through the APIM gateway (apim-ffc-gateway-prod, static egress
# 20.231.116.111 — the only IP on WHMCS's API allowlist), not the direct
# origin URL: see FFC-Cloudflare-Automation docs/whmcs-apim-routing.md.
#
# Scope is deliberately narrow, enforced two ways:
#   1. Only GetConfigurationValue and SetConfigurationValue actions.
#   2. A hard allowlist of setting names (SETTING_ALLOWLIST below).
#      tblconfiguration also stores sensitive rows (SMTP credentials,
#      CronKey, API access keys, captcha secrets); without the allowlist
#      this workflow would be an arbitrary config read/write primitive
#      and reads would leak secret values into run logs and step
#      summaries. Extend the allowlist only via reviewed PR, and only
#      with settings whose values are safe to print.
#
# Operator action: ensure the cpanel-staging environment has required
# reviewers — this workflow reads production credentials, so dispatch
# should need a human approval, not just repo write access.

name: WHMCS Config Ops

on:
  workflow_dispatch:
    inputs:
      api_action:
        description: 'API action'
        required: true
        default: 'GetConfigurationValue'
        type: choice
        options:
          - GetConfigurationValue
          - SetConfigurationValue
      setting:
        description: 'Configuration setting name (e.g. EnableTOSAccept, TermsOfServiceURL)'
        required: true
        type: string
      value:
        description: 'New value (SetConfigurationValue only; ignored on reads)'
        required: false
        type: string

permissions:
  id-token: write # OIDC to Azure; no checkout needed

jobs:
  whmcs-config:
    runs-on: ubuntu-latest
    environment: cpanel-staging
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.WR_ALL_FFC_AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ secrets.WR_ALL_FFC_AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Call WHMCS API (credentials from Key Vault, masked)
        env:
          API_ACTION: ${{ inputs.api_action }}
          SETTING: ${{ inputs.setting }}
          NEW_VALUE: ${{ inputs.value }}
        run: |
          set -euo pipefail
          # Only non-sensitive checkout/policy settings. Values of anything
          # on this list are safe to appear in logs and step summaries.
          SETTING_ALLOWLIST="EnableTOSAccept TermsOfService"
          allowed=false
          for s in $SETTING_ALLOWLIST; do
            if [ "$s" = "${SETTING}" ]; then allowed=true; break; fi
          done
          if [ "$allowed" != "true" ]; then
            echo "::error::Setting '${SETTING}' is not on the allowlist (${SETTING_ALLOWLIST}). tblconfiguration holds sensitive rows; extend the allowlist via reviewed PR only."
            exit 1
          fi
          v=kv-ffc-admin-prod-cbm
          ident=$(az keyvault secret show --vault-name "$v" --name read-all-ffc-whmcs-api-identifier --query value -o tsv --only-show-errors)
          secret=$(az keyvault secret show --vault-name "$v" --name read-all-ffc-whmcs-api-secret --query value -o tsv --only-show-errors)
          apimkey=$(az keyvault secret show --vault-name "$v" --name read-all-ffc-apim-whmcs-subscription-key --query value -o tsv --only-show-errors || true)
          # Gateway URL, not the direct origin from read-all-ffc-whmcs-api-url:
          # WHMCS's IP allowlist only admits APIM's static egress (20.231.116.111).
          # See FFC-Cloudflare-Automation docs/whmcs-apim-routing.md.
          url="https://apim-ffc-gateway-prod.azure-api.net/whmcs/api.php"
          echo "::add-mask::$ident"; echo "::add-mask::$secret"; echo "::add-mask::$apimkey"
          if [ -z "$ident" ] || [ -z "$secret" ] || [ -z "$url" ]; then
            echo "::error::WHMCS API secrets missing or empty in $v"
            exit 1
          fi

          args=(
            --data-urlencode "action=${API_ACTION}"
            --data-urlencode "identifier=${ident}"
            --data-urlencode "secret=${secret}"
            --data-urlencode "setting=${SETTING}"
            --data-urlencode "responsetype=json"
          )
          if [ "${API_ACTION}" = "SetConfigurationValue" ]; then
            args+=(--data-urlencode "value=${NEW_VALUE}")
          fi
          hdr=()
          if [ -n "$apimkey" ]; then
            hdr=(-H "Ocp-Apim-Subscription-Key: ${apimkey}")
          fi

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST "$url" "${hdr[@]}" "${args[@]}")
          echo "HTTP ${http_code}"
          # Never dump the raw response: print only the OData result/message
          # fields. Values are printed solely for allowlisted settings, which
          # are non-sensitive by construction.
          result=$(python3 -c "import json;print(json.load(open('response.json')).get('result',''))" || echo parse-error)
          message=$(python3 -c "import json;print(json.load(open('response.json')).get('message',''))" || true)
          echo "result=${result} ${message:+message=${message}}"
          {
            echo "## WHMCS ${API_ACTION}"
            echo ""
            echo "- Setting: \`${SETTING}\`"
            echo "- Result: \`${result}\` (HTTP ${http_code})"
            if [ "${API_ACTION}" = "GetConfigurationValue" ] && [ "${result}" = "success" ]; then
              val=$(python3 -c "import json;print(json.load(open('response.json')).get('value',''))" || true)
              echo "- Value: \`${val}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "${result}" = "success" ] || exit 1
