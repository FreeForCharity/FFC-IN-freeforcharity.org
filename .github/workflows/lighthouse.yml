name: Lighthouse CI

on:
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types:
      - completed
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  lighthouse:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # The audit measures first-party payload only. Third-party embeds
      # (the Zeffy donation iframe loads ~8MB of script) would otherwise
      # dominate the resource budgets and swing scores between runs, and
      # Lighthouse's blockedUrlPatterns cannot block cross-origin iframes
      # (they run in separate renderer processes). Blocking at the DNS
      # level covers every process.
      - name: Block third-party embed hosts (first-party-only audit)
        run: |
          sudo sh -c 'echo "127.0.0.1 www.zeffy.com zeffy.com zeffy-scripts.s3.ca-central-1.amazonaws.com widgets.guidestar.org www.googletagmanager.com" >> /etc/hosts'

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 30
