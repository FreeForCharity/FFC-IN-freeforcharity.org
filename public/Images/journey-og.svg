<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="og-title" aria-describedby="og-desc" font-family="Arial, Helvetica, sans-serif">
  <title id="og-title">The five-stage Free For Charity onboarding journey</title>
  <desc id="og-desc">Flow diagram of five stages: 1 Apply (validation and approval), 2 Website (built and validated on GitHub Pages), 3 Domain (free .org bought and pointed at your site), 4 Email (Microsoft 365 or Google Workspace), 5 Ongoing (renewals, DNS and support). An orange funding gate sits between the Website and Domain stages: no money is spent until your website is validated live.</desc>

  <!--
    1200x630 social-card variant of src/components/journey/JourneyDiagram.tsx.
    Palette copied from that component's AA-verified contrast table:
      BLUE   #0567B1  (5.86:1 with white text; 5.86:1 as text on white)
      ORANGE #A85400  (deepened brand orange: 5.34:1 on white, white on it 5.34:1
                       - the raw brand orange #F58C23 fails AA and is not used)
      INK    #1a2e35  (14.13:1 on white)
    Solid colors only (no gradients) so the PNG render stays small - see
    __tests__/assets/image-weight.test.ts. Rendered to journey-og.png by
    scripts/render-og-image.mjs.
  -->

  <defs>
    <marker id="og-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0567B1" />
    </marker>
  </defs>

  <!-- Solid background -->
  <rect x="0" y="0" width="1200" height="630" fill="#ffffff" />

  <!-- Headline -->
  <text x="60" y="86" font-size="50" font-weight="700" fill="#1a2e35">The website comes first.</text>
  <text x="60" y="130" font-size="23" fill="#1a2e35">Free websites for verified nonprofits &#8212; built and proven live before a dollar is spent.</text>

  <!-- Funding gate (between stages 2 and 3; boxes centered on x=483) -->
  <text x="483" y="196" text-anchor="middle" font-size="23" font-weight="700" fill="#A85400" letter-spacing="0.06em">FUNDING GATE</text>
  <line x1="483" y1="210" x2="483" y2="424" stroke="#A85400" stroke-width="5" stroke-dasharray="9 7" stroke-linecap="round" />
  <text x="483" y="462" text-anchor="middle" font-size="21" fill="#1a2e35">Money is spent only after your site is validated live</text>

  <!-- Connector arrows between consecutive stages (box mid-line y=315) -->
  <line x1="234" y1="315" x2="262" y2="315" stroke="#0567B1" stroke-width="3" marker-end="url(#og-arrow)" />
  <line x1="468" y1="315" x2="496" y2="315" stroke="#0567B1" stroke-width="3" marker-end="url(#og-arrow)" />
  <line x1="702" y1="315" x2="730" y2="315" stroke="#0567B1" stroke-width="3" marker-end="url(#og-arrow)" />
  <line x1="936" y1="315" x2="964" y2="315" stroke="#0567B1" stroke-width="3" marker-end="url(#og-arrow)" />

  <!-- Stage 1: Apply (before the gate: solid blue, white text) -->
  <g>
    <rect x="30" y="240" width="204" height="150" rx="12" fill="#0567B1" />
    <circle cx="62" cy="276" r="18" fill="#ffffff" />
    <text x="62" y="283" text-anchor="middle" font-size="20" font-weight="700" fill="#0567B1">1</text>
    <text x="88" y="283" font-size="25" font-weight="700" fill="#ffffff">Apply</text>
    <text x="46" y="330" font-size="17" fill="#ffffff">Validation &amp;</text>
    <text x="46" y="356" font-size="17" fill="#ffffff">approval</text>
  </g>

  <!-- Stage 2: Website (before the gate) -->
  <g>
    <rect x="264" y="240" width="204" height="150" rx="12" fill="#0567B1" />
    <circle cx="296" cy="276" r="18" fill="#ffffff" />
    <text x="296" y="283" text-anchor="middle" font-size="20" font-weight="700" fill="#0567B1">2</text>
    <text x="322" y="283" font-size="25" font-weight="700" fill="#ffffff">Website</text>
    <text x="280" y="330" font-size="17" fill="#ffffff">Built &amp; validated on</text>
    <text x="280" y="356" font-size="17" fill="#ffffff">GitHub Pages</text>
  </g>

  <!-- Stage 3: Domain (after the gate: white box, orange stroke, ink text) -->
  <g>
    <rect x="498" y="240" width="204" height="150" rx="12" fill="#ffffff" stroke="#A85400" stroke-width="3.5" />
    <circle cx="530" cy="276" r="18" fill="#A85400" />
    <text x="530" y="283" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">3</text>
    <text x="556" y="283" font-size="25" font-weight="700" fill="#1a2e35">Domain</text>
    <text x="514" y="330" font-size="17" fill="#1a2e35">Free .org bought &amp;</text>
    <text x="514" y="356" font-size="17" fill="#1a2e35">pointed at your site</text>
  </g>

  <!-- Stage 4: Email (after the gate) -->
  <g>
    <rect x="732" y="240" width="204" height="150" rx="12" fill="#ffffff" stroke="#A85400" stroke-width="3.5" />
    <circle cx="764" cy="276" r="18" fill="#A85400" />
    <text x="764" y="283" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">4</text>
    <text x="790" y="283" font-size="25" font-weight="700" fill="#1a2e35">Email</text>
    <text x="748" y="330" font-size="17" fill="#1a2e35">Microsoft 365 or</text>
    <text x="748" y="356" font-size="17" fill="#1a2e35">Google Workspace</text>
  </g>

  <!-- Stage 5: Ongoing (after the gate) -->
  <g>
    <rect x="966" y="240" width="204" height="150" rx="12" fill="#ffffff" stroke="#A85400" stroke-width="3.5" />
    <circle cx="998" cy="276" r="18" fill="#A85400" />
    <text x="998" y="283" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">5</text>
    <text x="1024" y="283" font-size="25" font-weight="700" fill="#1a2e35">Ongoing</text>
    <text x="982" y="330" font-size="17" fill="#1a2e35">Renewals, DNS &amp;</text>
    <text x="982" y="356" font-size="17" fill="#1a2e35">support forever</text>
  </g>

  <!-- Wordmark -->
  <text x="600" y="566" text-anchor="middle" font-size="36" font-weight="700" fill="#0567B1">freeforcharity.org</text>
</svg>
